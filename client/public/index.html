<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
  <title>Boma - Online Reservation Management System</title>
  <style>
    :root {
      --navy-950: #0B1220;
      --navy-900: #0F172A;
      --navy-800: #1E293B;
      --blue-700: #1D4ED8;
      --blue-600: #2563EB;
      --blue-100: #DBEAFE;
      --blue-50: #EFF6FF;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748B;
      --slate-400: #94A3B8;
      --slate-300: #CBD5E1;
      --slate-200: #E2E8F0;
      --slate-100: #F1F5F9;
      --slate-50: #F8FAFC;
      --white: #FFFFFF;
      --danger: #DC2626;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.05), 0 18px 40px -28px rgba(15, 23, 42, 0.45);
    }

    html { -webkit-text-size-adjust: 100%; }
    html, body, #root { min-height: 100%; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(900px 500px at 100% 0%, rgba(37, 99, 235, 0.06), transparent 60%),
        var(--slate-100);
      color: var(--navy-900);
      -webkit-font-smoothing: antialiased;
    }

    *, *::before, *::after { box-sizing: border-box; }

    button, input, select, textarea { font-family: inherit; }
    a { color: var(--blue-600); }

    h1, h2, h3, p { overflow-wrap: anywhere; }

    /* ---------- Portal shell ---------- */
    .portal-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .portal-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background:
        radial-gradient(700px 260px at 12% 0%, rgba(37, 99, 235, 0.20), transparent 65%),
        linear-gradient(100deg, var(--navy-900) 0%, #111C2E 58%, var(--navy-950) 100%);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 12px 30px -22px rgba(2, 6, 23, 0.9);
    }

    .portal-nav-inner {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .portal-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      line-height: 1.1;
      flex-shrink: 0;
    }

    .portal-brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--blue-600);
      color: var(--white);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 8px 11px;
      border-radius: 9px;
      box-shadow: 0 6px 16px -6px rgba(37, 99, 235, 0.9);
    }

    .portal-brand-sub {
      color: var(--slate-400);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      max-width: 120px;
      line-height: 1.35;
    }

    .portal-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      flex: 1;
    }

    .portal-link {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      color: #CBD5E1;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .portal-link:hover {
      background: rgba(148, 163, 184, 0.12);
      color: var(--white);
    }

    .portal-link.active {
      background: rgba(37, 99, 235, 0.22);
      border-color: rgba(96, 165, 250, 0.42);
      color: var(--white);
      font-weight: 600;
    }

    .portal-link:focus-visible {
      outline: 2px solid #60A5FA;
      outline-offset: 2px;
    }

    .portal-user {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .portal-user-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.3;
    }

    .portal-user-meta strong {
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .portal-user-meta span {
      color: var(--slate-400);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .portal-main {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 56px;
      flex: 1;
    }

    .portal-heading { margin-bottom: 22px; }

    .portal-heading h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--navy-900);
      font-weight: 700;
    }

    .portal-heading p {
      margin: 7px 0 0;
      color: var(--slate-500);
      font-size: 14px;
      line-height: 1.5;
      max-width: 760px;
    }

    .portal-footer {
      border-top: 1px solid var(--slate-200);
      background: rgba(255, 255, 255, 0.7);
      padding: 18px 24px;
      text-align: center;
      color: var(--slate-500);
      font-size: 12px;
    }

    /* ---------- Cards & grids ---------- */
    .card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
      padding: 20px;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .card-head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      color: var(--navy-900);
      font-weight: 700;
    }

    .card-head p {
      margin: 4px 0 0;
      color: var(--slate-500);
      font-size: 13px;
      line-height: 1.5;
    }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .portal-grid-compact {
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }

    .stat-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      padding: 15px 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .stat-label {
      color: var(--slate-500);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat-value {
      color: var(--navy-900);
      font-size: 25px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .stat-hint {
      color: var(--slate-400);
      font-size: 11.5px;
      line-height: 1.35;
    }

    .portal-quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 8px;
      border: 1px solid transparent;
      padding: 9px 15px;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 130ms ease, border-color 130ms ease, color 130ms ease, box-shadow 130ms ease;
    }

    .btn:focus-visible {
      outline: 2px solid var(--blue-600);
      outline-offset: 2px;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--blue-600);
      border-color: var(--blue-600);
      color: var(--white);
      box-shadow: 0 8px 18px -12px rgba(37, 99, 235, 0.9);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--blue-700);
      border-color: var(--blue-700);
    }

    .btn-secondary {
      background: var(--white);
      border-color: var(--slate-300);
      color: var(--slate-700);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--slate-50);
      border-color: var(--slate-400);
    }

    .btn-danger {
      background: #FEF2F2;
      border-color: #FECACA;
      color: #B91C1C;
    }

    .btn-danger:hover:not(:disabled) {
      background: #FEE2E2;
      border-color: #FCA5A5;
    }

    .btn-ghost-light {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(203, 213, 225, 0.35);
      color: #E2E8F0;
      padding: 7px 12px;
      font-size: 12.5px;
    }

    .btn-ghost-light:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(226, 232, 240, 0.6);
      color: var(--white);
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 7px;
    }

    /* ---------- Toolbars, inputs ---------- */
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .toolbar-search {
      flex: 1 1 260px;
      max-width: 430px;
    }

    .toolbar-select {
      flex: 0 1 190px;
    }

    .toolbar-note {
      color: var(--slate-500);
      font-size: 12.5px;
      margin-left: auto;
    }

    .portal-input {
      width: 100%;
      background: var(--white);
      color: var(--navy-900);
      border: 1px solid var(--slate-300);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 14px;
      line-height: 1.45;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .portal-input::placeholder { color: var(--slate-400); }

    .portal-input:hover:not(:disabled) { border-color: var(--slate-400); }

    .portal-input:focus {
      outline: none;
      border-color: var(--blue-600);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    .portal-input:disabled {
      background: var(--slate-50);
      color: var(--slate-500);
    }

    textarea.portal-input { resize: vertical; min-height: 76px; }

    select.portal-input { cursor: pointer; }

    .portal-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .portal-field-label {
      color: var(--slate-600);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .portal-field-hint {
      color: var(--slate-400);
      font-size: 11.5px;
      line-height: 1.4;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .portal-check {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--slate-700);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .portal-check input {
      width: 16px;
      height: 16px;
      accent-color: var(--blue-600);
      cursor: pointer;
    }

    .amount-preview {
      display: flex;
      align-items: center;
      min-height: 39px;
      background: var(--blue-50);
      border: 1px solid #BFDBFE;
      border-radius: 8px;
      padding: 9px 11px;
      color: #1E40AF;
      font-size: 14px;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      padding-top: 4px;
    }

    .report-form {
      display: grid;
      grid-template-columns: minmax(180px, 1.2fr) minmax(150px, 1fr) minmax(150px, 1fr) auto;
      gap: 14px;
      align-items: end;
    }

    /* ---------- Tables ---------- */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      background: var(--white);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 680px;
    }

    th, td {
      padding: 11px 12px;
      text-align: left;
      border-bottom: 1px solid var(--slate-200);
      vertical-align: middle;
    }

    thead th {
      background: var(--slate-50);
      color: var(--slate-500);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      white-space: nowrap;
      border-bottom: 1px solid var(--slate-200);
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover { background: #FBFDFF; }

    tbody td { color: var(--slate-700); }

    tbody td strong { color: var(--navy-900); font-weight: 600; }

    .code-ref {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .cell-sub {
      margin-top: 3px;
      color: var(--slate-400);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.3;
    }

    .empty-cell {
      text-align: center;
      color: var(--slate-500);
      padding: 30px 16px;
      font-size: 13px;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 120px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-top: 14px;
      color: var(--slate-500);
      font-size: 12.5px;
    }

    .muted {
      color: var(--slate-500);
      font-size: 12.5px;
    }

    /* ---------- Badges & alerts ---------- */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      line-height: 1.25;
      white-space: nowrap;
    }

    .alert {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--slate-200);
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .alert > span { flex: 1; }

    .alert-error {
      background: #FEF2F2;
      border-color: #FECACA;
      color: #991B1B;
    }

    .alert-success {
      background: #F0FDF4;
      border-color: #BBF7D0;
      color: #166534;
    }

    .alert-info {
      background: var(--blue-50);
      border-color: #BFDBFE;
      color: #1E40AF;
    }

    .alert-close {
      background: none;
      border: none;
      color: inherit;
      font-size: 18px;
      line-height: 1;
      padding: 0;
      margin-left: auto;
      cursor: pointer;
      opacity: 0.65;
    }

    .alert-close:hover { opacity: 1; }

    /* ---------- Modals ---------- */
    .portal-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(2px);
    }

    .portal-modal {
      width: 100%;
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      background: var(--white);
      border-radius: 16px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 30px 70px -20px rgba(2, 6, 23, 0.65);
      padding: 22px;
    }

    .portal-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .portal-modal-head h2 {
      margin: 0;
      color: var(--navy-900);
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
    }

    .portal-modal-head p {
      margin: 5px 0 0;
      color: var(--slate-500);
      font-size: 13px;
      line-height: 1.5;
    }

    .icon-btn {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: 8px;
      color: var(--slate-500);
      font-size: 20px;
      line-height: 1;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--slate-100);
      color: var(--navy-900);
    }

    .icon-btn:focus-visible {
      outline: 2px solid var(--blue-600);
      outline-offset: 2px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .report-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .portal-brand-sub { display: none; }
    }

    @media (max-width: 760px) {
      .portal-nav-inner { padding: 12px 16px; gap: 12px; }
      .portal-links { order: 3; width: 100%; flex: 1 0 100%; overflow-x: auto; padding-bottom: 2px; }
      .portal-link { white-space: nowrap; font-size: 12.5px; padding: 7px 10px; }
      .portal-user { margin-left: auto; }
      .portal-user-meta { display: none; }
      .portal-main { padding: 24px 16px 44px; }
      .portal-heading h1 { font-size: 23px; }
      .form-grid { grid-template-columns: minmax(0, 1fr); }
      .report-form { grid-template-columns: minmax(0, 1fr); }
      .toolbar-search { max-width: none; }
      .toolbar-note { margin-left: 0; width: 100%; }
      .portal-footer { padding: 16px; }
    }

    @media (max-width: 520px) {
      .card { padding: 15px; }
      .portal-modal { padding: 17px; }
      .modal-actions { justify-content: stretch; }
      .modal-actions .btn { flex: 1; }
      .stat-value { font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
  <!-- Google Identity Services: enables "Continue with Google" when REACT_APP_GOOGLE_CLIENT_ID is configured. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
